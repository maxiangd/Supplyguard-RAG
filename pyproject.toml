[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
# profile="black" 保证 isort 的导入排序规则和 black 的格式不冲突
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

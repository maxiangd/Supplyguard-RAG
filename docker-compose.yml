services:
  redis:
    image: redis:7-alpine
    container_name: supplyguard-redis
    # 映射到 6380：本机 6379 已被其他 Redis 占用
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: supplyguard-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/data
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
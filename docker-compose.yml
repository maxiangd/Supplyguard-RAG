services:
  redis:
    image: redis:7-alpine
    container_name: supplyguard-redis
    # 映射到 6380：本机 6379 已被其他 Redis 占用
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: supplyguard-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: supplyguard-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # 用户名固定 neo4j，密码取根目录 .env，未配置时用默认值
      NEO4J_AUTH: neo4j/${APP_NEO4J_PASSWORD:-change-me}
      # 演示规模很小，堆和页缓存按最小可用配置给
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
  neo4j-data: